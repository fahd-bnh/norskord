          """

              val list: List<Word> = RAW.trim().lines().mapNotNull {
                  val p = it.split("|")
                  if (p.size == 4) Word(p[0], p[1], p[2], p[3]) else null
              }

              /** Word #1 is shown on the day the daily word is first enabled, then one new word per day. */
              fun today(ctx: Context): Word {
                  val prefs = ctx.getSharedPreferences("prefs", Context.MODE_PRIVATE)
                  val now = LocalDate.now().toEpochDay()
                  var start = prefs.getLong("start", -1L)
                  if (start < 0) { start = now; prefs.edit().putLong("start", now).apply() }
                  val i = (((now - start) % list.size) + list.size) % list.size
                  return list[i.toInt()]
              }
          }
